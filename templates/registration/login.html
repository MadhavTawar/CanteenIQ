{% extends 'base.html' %}
{% block title %}Login — CanteenIQ{% endblock %}
{% block content %}
<div class="auth-form">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="primary-btn">Login</button>
    </form>
    <p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
