{% extends 'base.html' %}
{% block title %}Sign up — CanteenIQ{% endblock %}
{% block content %}
<div class="auth-form">
    <h1>Create a student account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="primary-btn">Sign up</button>
    </form>
    <p class="muted">New accounts are students by default. Staff accounts are promoted via /admin/.</p>
</div>
{% endblock %}
